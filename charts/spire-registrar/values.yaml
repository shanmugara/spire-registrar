replicaCount: 1

image:
  repository: docker.io/shanmugara/spire-registrar
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.11"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created for the controller pod.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 64Mi

leaderElection:
  # Enable leader election for the controller manager.
  # Required when replicaCount > 1.
  enabled: false

metrics:
  # Port for the Prometheus metrics endpoint.
  port: 8080
  # Serve metrics over HTTPS.
  secure: false

healthProbe:
  # Port for liveness and readiness probes (/healthz, /readyz).
  port: 8081

nodeSelector: {}

tolerations: []

affinity: {}

kubernetesClusterDomain: cluster.local
